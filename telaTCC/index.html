<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MostraTcc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="titulo">
        <h1 class="texto_titulo">Mostras de TCC</h1>
    </header>

    <main class="conteudo">
        <div class ="carousel-conteiner">
            <div class="carousel-item">
                <img src="items/foto.png" alt="Imagem do TCC 1">
            </div>
            <div class="carousel-item">
                <img src="items/foto2.png" alt="Imagem do TCC 2">
            </div>
        </div>
    </main>

    <footer class="qrCode">
        <div class="logos">
            <img src="items/qrcode.png" alt="qrcode">
            <p>Escaneie o Qr code para ver a informação</p>
        </div>

        <div class="waveFooter">
            <svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,60 C150,90 350,30 600,60 C850,90 1050,30 1200,60 L1200,120 L0,120 Z" />
            </svg>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
