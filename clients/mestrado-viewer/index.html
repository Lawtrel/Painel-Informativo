<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestrado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="titulo">
        <div class="logos-container">
            <img src="assets/logoUNEB.png" alt="Logo UNEB" class="header-logo">
            <img src="assets/logoPPGMSB.png" alt="Logo PPGMSB" class="header-logo">
        </div>
        <div class="header-wave">
              <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                  <path d="M0,40 Q360,80 720,40 Q1080,0 1440,40 L1440,80 L0,80 Z" fill="#ffffff"/>
              </svg>
          </div>
    </header>

    <main class="conteudo">
        <div class="carousel-container" id="media-slideshow-container">
            <h3>Apresentação</h3>
            <div class="slideshow-wrapper">
                </div>
        </div>
    </main>

    <footer class="qrCode">
        <div class="footer-wave">
            <svg viewBox="0 0 1440 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M0,30 Q300,60 600,40 Q900,20 1200,40 Q1350,50 1440,30 L1440,60 L0,60 Z" fill="#2c3e50"/>
            </svg>
        </div>
        <div class="qrCode-content">
            <img id="qrCodeImg" src="https://via.placeholder.com/120x120/ffffff/2c3e50?text=QR" alt="QR Code do artigo">
            <p>Escaneie para aceder ao artigo completo!</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
