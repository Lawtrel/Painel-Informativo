<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biologia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Cabeçalho com título e subtítulo -->
  <header class="titulo">
    <img src="LOGO (2).png" alt="Logo Biologia" class="logo-biologia">

    <div class="texto_titulo principal">Painel Informativo</div>
    <div class="texto_titulo subtitulo">Curso de Biologia</div>
    <div class="header-wave">
      <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path d="M0,40 Q360,80 720,40 Q1080,0 1440,40 L1440,80 L0,80 Z" fill="#ffffff"/>
      </svg>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="conteudo">
    <div class="painel-imagem">
      <img src="imagens/1.jpg" alt="Imagem do Curso Biologia" />
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
